name: forecastfoundry

services:
  app:
    build: .
    restart: unless-stopped
    user: forecastfoundry
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/weatheredge.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - weatheredge-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    build: .
    restart: unless-stopped
    user: forecastfoundry
    environment:
      APP_ENV: production
      EXECUTION_ENABLED: "false"
      HERMES_MCP_ENABLED: "true"
    entrypoint: ["/app/docker/mcp-entrypoint.sh"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import app.mcp_server"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  weatheredge-data:
    name: weatheredge_weatheredge-data
