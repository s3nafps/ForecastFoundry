name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: mkdir -p data
      - run: pytest -q
      - run: ruff check .
      - run: mypy app
      - run: DATABASE_URL=sqlite+aiosqlite:///./data/ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite+aiosqlite:///./data/ci.db alembic downgrade base
      - run: git diff --check
      - name: Secret material scan
        run: |
          ! rg -n "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|(^|[= ])(sk|pk)-[A-Za-z0-9_-]{20,}" --glob '!*.lock' --glob '!.venv/**' .

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORECASTFOUNDRY_TEST_POSTGRES: "1"
      FORECASTFOUNDRY_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres alembic upgrade head
      - run: DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres alembic downgrade base
      - run: DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres alembic upgrade head
      - run: pytest tests/test_postgres_integration.py -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Materialize compose secrets (untracked in repo)
        run: mkdir -p secrets && printf 'postgres' > secrets/postgres_password
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up -d --no-build
      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "health ok"; exit 0
            fi
            sleep 3
          done
          echo "health check timed out; dumping container state"
          docker compose ps
          docker compose logs app migrate || true
          exit 1
      - run: curl --fail http://127.0.0.1:8000/ready
      - name: Wait for all services healthy
        run: |
          for i in $(seq 1 30); do
            healthy=0
            for svc in app scheduler mcp executor; do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "forecastfoundry-$svc-1" 2>/dev/null || echo missing)
              [ "$status" = "healthy" ] && healthy=$((healthy+1))
            done
            if [ "$healthy" -eq 4 ]; then
              echo "all services healthy"; exit 0
            fi
            sleep 5
          done
          echo "services not healthy:"
          docker compose ps
          docker compose logs scheduler mcp executor || true
          exit 1
      - run: docker compose ps
      - run: docker compose down
